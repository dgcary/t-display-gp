[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -Ilib/core
  -Ilib/providers
  -Isrc/app
  -Isrc/device
  -Isrc/network
  -Isrc/ui
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DINIT_SEQUENCE_3=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DCGRAM_OFFSET=1
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_INVERSION_ON=1
  -DTFT_PARALLEL_8_BIT=1
  -DTFT_CS=6
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=27000000
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#master
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@6.21.6

[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson@6.21.6
test_build_src = true
build_flags =
  -DUNITY_INCLUDE_DOUBLE
  -Ilib/core
  -Ilib/providers
  -Isrc/app
  -Isrc/network
  -Isrc/device
  -Isrc/ui
build_src_filter =
  +<app/AppShell.cpp>
  +<app/StockController.cpp>
  +<app/WeatherController.cpp>
  +<network/EastMoneyProvider.cpp>
  +<network/OpenMeteoProvider.cpp>
  +<network/TencentProvider.cpp>
  +<network/ProvisioningForm.cpp>
  +<ui/StockScreen.cpp>
  +<ui/WeatherCatArt.cpp>
  +<ui/WeatherVisuals.cpp>
