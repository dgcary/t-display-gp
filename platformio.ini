[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DINIT_SEQUENCE_3=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DCGRAM_OFFSET=1
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_INVERSION_ON=1
  -DTFT_PARALLEL_8_BIT=1
  -DTFT_CS=6
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=27000000
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#master
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@6.21.6

[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson@6.21.6
test_build_src = true
build_flags =
  -Isrc/app
  -Isrc/network
  -Isrc/device
  -Isrc/ui
build_src_filter =
  +<app/StockController.cpp>
  +<network/EastMoneyProvider.cpp>
  +<network/TencentProvider.cpp>
  +<network/ProvisioningForm.cpp>
  +<ui/StockScreen.cpp>
