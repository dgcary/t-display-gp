name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_tdisplay_setup.py
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e lilygo-t-display-s3
